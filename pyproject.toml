[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanlink-desktop"
version = "0.4.0"
description = "Independent trusted-LAN communication prototype"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
lanlink = "lanlink.app:main"

[tool.setuptools.packages.find]
include = ["lanlink*"]
